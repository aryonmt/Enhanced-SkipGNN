# Python >=3.10,<3.13. Create with: conda env create -f environment.yml
# CPU and GPU both use the pip install below (no CUDA build is pinned here).
# GPU: CUDA must match the installed PyTorch wheel (https://pytorch.org),
# not a PyTorch Geometric (PyG) wheel.
name: ams-skipgnn
channels:
  - pytorch
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - pip
  - pip:
      - -e ".[dev]"
